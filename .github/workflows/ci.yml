name: CI

# Sur les PR : vérifications seulement, aucun secret utilisé (dépôt public, PR de forks possibles).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle (dry run, sans compte Cloudflare)
        run: npx wrangler deploy --dry-run --outdir dist
